name: Sync upstream

on:
  schedule:
    # 00:00 KST (UTC+9) = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/merge-upstream"             -f branch=main
